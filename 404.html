<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Namma Kannada</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#C8102E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFD21F' stroke='black' stroke-width='4'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23E8202A' font-family='sans-serif'%3E%E0%B2%95%3C/text%3E%3C/svg%3E">
  <!-- Root-relative paths: the host serves this page for any missing URL, at any depth -->
  <link rel="stylesheet" href="/css/fonts.css?v=6">
  <link rel="stylesheet" href="/css/style.css?v=6">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Namma Kannada, home">
      <span class="brand-kn" lang="kn">ನಮ್ಮ ಕನ್ನಡ</span>
      <span class="brand-en">One language, many voices across Karnataka</span>
    </a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open menu">
      <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="menu-txt">Menu</span>
    </button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="/#/">Explore</a>
      <a href="/#/compare">Compare</a>
      <a href="/#/guide">How to say it</a>
      <a href="/#/quiz">Guess the region</a>
      <a href="/#/add">Add a word</a>
      <a href="/#/sources">Sources</a>
    </nav>
  </header>

  <main class="nf-page">
    <div class="notfound">
      <p class="nf-code" aria-hidden="true">404</p>
      <h1><span lang="kn">ಅಯ್ಯೋ!</span> This page got lost</h1>
      <p class="lede">There is no page at this address. It may have been moved, or the link has a typo.</p>
      <div class="actions">
        <a class="btn" href="/">Back to the map</a>
        <a class="btn ghost" href="/#/quiz">Play Guess the region</a>
      </div>
    </div>
  </main>

  <script>
    // Same mobile menu as the main site, without loading the app.
    (function () {
      var btn = document.querySelector(".menu-btn"), nav = document.getElementById("nav");
      function set(open) {
        nav.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", String(open));
        btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      }
      btn.addEventListener("click", function () { set(!nav.classList.contains("open")); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") set(false); });
      document.addEventListener("click", function (e) { if (!e.target.closest(".top")) set(false); });
    })();
  </script>
</body>
</html>
